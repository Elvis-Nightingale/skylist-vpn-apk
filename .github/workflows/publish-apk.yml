name: Publish Debug APK Release

on:
  push:
    branches:
      - main
      - master
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare APK for Release
        run: |
          set -e
          if [ -f "apk-distribution/app-debug.apk" ] && [ -s "apk-distribution/app-debug.apk" ]; then
            echo "Using pre-built APK from apk-distribution/..."
          else
            echo "Building APK via Gradle in CI..."
            chmod +x gradlew || true
            ./gradlew assembleDebug || gradle assembleDebug
            mkdir -p apk-distribution
            cp app/build/outputs/apk/debug/app-debug.apk apk-distribution/app-debug.apk
            cd apk-distribution
            sha256sum app-debug.apk > app-debug.apk.sha256
            cd ..
          fi

          # Validate integrity
          cd apk-distribution
          unzip -tq app-debug.apk
          sha256sum app-debug.apk > app-debug.apk.sha256
          cd ..
          echo "APK is ready and verified."

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK_PATH="apk-distribution/app-debug.apk"
          SHA_PATH="apk-distribution/app-debug.apk.sha256"
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          APK_SIZE=$(ls -lh "$APK_PATH" | awk '{print $5}')
          REPO="${{ github.repository }}"
          RUN_NUM="${{ github.run_number }}"

          TAG="v1.0.0-build.${RUN_NUM}"
          TITLE="Skylist VPN v1.0.0 (Build ${RUN_NUM})"

          echo "Publishing release $TAG for $REPO..."

          # Delete existing latest tag if present so it moves cleanly
          git tag -f latest || true

          gh release create "$TAG" "$APK_PATH" "$SHA_PATH" \
            --title "$TITLE" \
            --notes "### Skylist VPN (v2rayNG Foundation)
          - **File:** \`app-debug.apk\`
          - **File Size:** $APK_SIZE
          - **SHA-256 Checksum:** \`$SHA256\`
          - **Engine:** Official v2rayNG core with active TUN routing
          - **Direct Download URL:** https://github.com/$REPO/releases/latest/download/app-debug.apk" \
            --latest \
            --clobber || gh release upload "$TAG" "$APK_PATH" "$SHA_PATH" --clobber

          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          DOWNLOAD_URL="https://github.com/$REPO/releases/latest/download/app-debug.apk"

          echo "### APK Release Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag:** \`$TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Size:** $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`$SHA256\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download URL:** [$DOWNLOAD_URL]($DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
